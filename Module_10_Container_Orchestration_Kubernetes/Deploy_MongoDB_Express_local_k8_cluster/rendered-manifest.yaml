apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: mongo-demo
  name: mongo-demo
---
apiVersion: v1
data:
  database_url: mongodb-service:27017
kind: ConfigMap
metadata:
  name: mongodb-configmap
  namespace: mongo-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: mongo-demo
stringData:
  express_password: local-express-change-me
  express_username: express-admin
  password: local-demo-change-me
  username: demo-admin
type: Opaque
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: mongo-express
    app.kubernetes.io/part-of: mongo-demo
  name: mongo-express
  namespace: mongo-demo
spec:
  ports:
  - name: http
    nodePort: 30000
    port: 8081
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: mongo-express
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: mongo-demo
  name: mongodb-service
  namespace: mongo-demo
spec:
  ports:
  - name: mongodb
    port: 27017
    protocol: TCP
    targetPort: mongodb
  selector:
    app.kubernetes.io/name: mongodb
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: mongo-demo
  name: mongodb-data
  namespace: mongo-demo
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: mongo-express
    app.kubernetes.io/part-of: mongo-demo
  name: mongo-express
  namespace: mongo-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo-express
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-express
        app.kubernetes.io/part-of: mongo-demo
    spec:
      containers:
      - env:
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: mongodb-secret
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: mongodb-secret
        - name: ME_CONFIG_BASICAUTH_USERNAME
          valueFrom:
            secretKeyRef:
              key: express_username
              name: mongodb-secret
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              key: express_password
              name: mongodb-secret
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              key: database_url
              name: mongodb-configmap
        - name: ME_CONFIG_MONGODB_URL
          value: mongodb://$(ME_CONFIG_MONGODB_ADMINUSERNAME):$(ME_CONFIG_MONGODB_ADMINPASSWORD)@$(DATABASE_URL)/?authSource=admin
        image: mongo-express:1.0.2-20-alpine3.19
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        name: mongo-express
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: mongo-demo
  name: mongodb
  namespace: mongo-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: mongo-demo
    spec:
      containers:
      - env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: mongodb-secret
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: mongodb-secret
        image: mongo:8.0.5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 15
          tcpSocket:
            port: mongodb
        name: mongodb
        ports:
        - containerPort: 27017
          name: mongodb
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: mongodb
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /data/db
          name: mongodb-data
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-data
