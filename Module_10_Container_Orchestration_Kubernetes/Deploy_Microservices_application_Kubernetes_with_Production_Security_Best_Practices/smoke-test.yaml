apiVersion: batch/v1
kind: Job
metadata:
  name: storefront-smoke-test
  labels:
    app.kubernetes.io/component: smoke-test
    app.kubernetes.io/part-of: storefront-demo
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: smoke-test
        app.kubernetes.io/part-of: storefront-demo
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke-test
          image: curlimages/curl:8.10.1
          args: ["--fail", "--silent", "--show-error", "http://storefront:8080/"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true