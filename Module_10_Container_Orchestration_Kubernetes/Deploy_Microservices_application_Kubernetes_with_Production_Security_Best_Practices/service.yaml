apiVersion: v1
kind: Service
metadata:
  name: storefront
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: storefront-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: cart-cache
  labels:
    app.kubernetes.io/name: cart-cache
    app.kubernetes.io/part-of: storefront-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cart-cache
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis