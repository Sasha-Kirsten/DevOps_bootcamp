apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: my-app 
  labels: 
    app: my-app 
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: my-app 
  template:
    metadata:
      labels:
        app: my-app 
    spec:
      imagePullPolicy:
      - name: my-registry-key 
      containers:
      - name: my-app 
        image: XXXXX.dkr.ecr.eu-central-1.amazonaws.com/XXXX 
        imagePullPolicy: Always
        ports:
        - containerPort: 3000 