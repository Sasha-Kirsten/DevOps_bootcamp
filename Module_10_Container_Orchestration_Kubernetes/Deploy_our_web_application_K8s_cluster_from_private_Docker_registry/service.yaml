apiVersion: v1
kind: Service
metadata:
  name: my-app
  namespace: private-ecr-demo
  labels:
    app.kubernetes.io/name: my-app
    app.kubernetes.io/part-of: private-ecr-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: my-app
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http