# Values for the cartservice Helm release.
# An unprivileged NGINX image makes this a safe, testable demo workload.
appName: cartservice
appImage: nginxinc/nginx-unprivileged
appVersion: "1.27.4-alpine"
imagePullPolicy: IfNotPresent
appReplicas: 1
containerPort: 8080

containerEnvVars:
  - name: SERVICE_ROLE
    value: "cart"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
