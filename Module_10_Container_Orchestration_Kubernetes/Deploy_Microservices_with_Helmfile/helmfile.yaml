helmDefaults:
  createNamespace: true
  wait: true
  waitForJobs: true
  atomic: true
  cleanupOnFail: true
  timeout: 300
  historyMax: 10

releases:
  # TODO: This is a runnable website plus cache demonstration, not an integrated
  # business application. Add a real application release that uses Redis before
  # presenting it as an end-to-end microservices system.
  - name: storefront
    namespace: microservice-demo
    chart: ../Create_Helm_Chart_for_Microservices
    labels:
      app.kubernetes.io/part-of: helmfile-demo
      app.kubernetes.io/component: frontend
    values:
      - values/email-service-values.yaml

  - name: cart-cache
    namespace: microservice-demo
    chart: ./charts/redis 
    labels:
      app.kubernetes.io/part-of: helmfile-demo
      app.kubernetes.io/component: cache
    values:
      - values/redis-production-values.yaml