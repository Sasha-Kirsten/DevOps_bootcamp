appName: recommendationservice
appImage: example-registry/recommendationservice
appVersion: "1.0.0"
appReplicas: 2
containerPort: 8080

containerEnvVars:
  - name: PORT
    value: "8080"
  - name: PRODUCT_CATALOG_SERVICE_ADDR
    value: "productcatalogservice:3550"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080