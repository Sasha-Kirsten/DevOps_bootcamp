appName: emailservice
fullnameOverride: emailservice
appImage: gcr.io/google-samples/microservices-demo/emailservice
appVersion: "v0.10.3"
imagePullPolicy: IfNotPresent
appReplicas: 2
containerPort: 8080
containerEnvVars:
  - name: PORT
    value: "8080"

service:
  type: ClusterIP
  port: 5000
  targetPort: 8080

probes:
  enabled: false

testConnection:
  enabled: false