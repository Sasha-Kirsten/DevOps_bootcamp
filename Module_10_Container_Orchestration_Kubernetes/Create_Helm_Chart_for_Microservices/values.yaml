appName: nginx-demo
appImage: nginxinc/nginx-unprivileged
appVersion: "1.27.4-alpine"
imagePullPolicy: IfNotPresent
appReplicas: 1
containerPort: 8080
containerEnvVars:
  - name: ENV_VAR_ONE
    value: "valueone"
  - name: ENV_VAR_TWO
    value: "valuetwo"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

probes:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

ingress:
  enabled: false
  className: nginx
  host: ""
  path: /

testConnection:
  enabled: true
