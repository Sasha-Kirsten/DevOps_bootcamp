# Baby step 1: ConfigMap = normal configuration (safe to read, not for passwords).
# This key becomes the file /mosquitto/config/mosquitto.conf in the Pod.
apiVersion: v1
kind: ConfigMap

---
# Baby step 2: Secret = sensitive data.
# IMPORTANT: Replace this placeholder with a file generated by `mosquitto_passwd`.
# The password file must contain a password HASH, not `username=plain-text-password`.
# Do not commit a real password file to source control.
apiVersion: v1
kind: Secret

---
# Baby step 3: Deployment = runs one Mosquitto container.
apiVersion: apps/v1
kind: Deployment

---
# Baby step 4: Service = stable internal DNS name for MQTT clients.
apiVersion: v1
kind: Service

