services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPOSITORY:-cicd-starter}:${IMAGE_TAG:-local}
    environment:
      APP_VERSION: ${IMAGE_TAG:-local}
    ports:
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
