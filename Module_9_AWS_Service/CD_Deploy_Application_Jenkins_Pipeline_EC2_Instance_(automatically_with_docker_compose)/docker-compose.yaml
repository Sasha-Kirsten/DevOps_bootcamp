services:
  myapp:
    image: ${APP_IMAGE:?Set APP_IMAGE to the immutable image published by Jenkins.}
    container_name: myapp
    ports:
      - "8090:8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/health | grep -q '^OK$'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s