services:
  web:
    image: ${IMAGE_REPOSITORY:-ec2-web-starter}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/health | grep -q '^ok$'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
