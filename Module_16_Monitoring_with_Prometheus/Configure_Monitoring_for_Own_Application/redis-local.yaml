# Local learning dependency only. This is intentionally a single, ephemeral Redis instance with no authentication.
# Do not use this manifest for production data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: default
  labels:
    app.kubernetes.io/name: redis-cart
    app.kubernetes.io/part-of: redis-monitoring-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-cart
        app.kubernetes.io/part-of: redis-monitoring-demo
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: default
  labels:
    app.kubernetes.io/name: redis-cart
    app.kubernetes.io/part-of: redis-monitoring-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-cart
  ports:
    - name: redis
      port: 6379
      targetPort: redis