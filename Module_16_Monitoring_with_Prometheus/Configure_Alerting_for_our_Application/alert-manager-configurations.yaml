apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: application-email-routing
  namespace: monitoring
  labels:
    # Confirm this label matches Alertmanager.spec.alertmanagerConfigSelector.
    release: monitoring
    app.kubernetes.io/part-of: application-alerting-demo
spec:
  route:
    receiver: platform-email
    groupBy:
      - alertname
      - namespace
      - severity
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: platform-email
        matchers:
          - name: team
            value: platform
            regex: false
  receivers:
    - name: platform-email
      emailConfigs:
        # TODO: Replace the example addresses and SMTP server with a real
        # environment-specific receiver before applying this configuration.
        - to: alerts@example.invalid
          from: alerts@example.invalid
          smarthost: smtp.example.invalid:587
          authUsername: alerts@example.invalid
          authIdentity: alerts@example.invalid
          authPassword:
            name: smtp-auth
            key: password
          requireTLS: true