apiVersion: apps/v1
kind: Deploy
metadata:
  name: java-maven-app 
  labels:
    app: java-maven-app 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-maven-app 
  template: 
    metadata:
      labels:
        app: java-maven-app 
    spec: 
      containers:
      - name: $APP_NAME  
        image: $DOCKER_REPO:$IMAGE_NAME 
        imagePullPolicy: Always 
        ports:
          - containerPort: 8080