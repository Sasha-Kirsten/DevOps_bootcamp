apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
	name: portfolio-fargate-demo
	region: eu-central-1

iam:
	withOIDC: true

fargateProfiles:
	- name: coredns
		selectors:
			- namespace: kube-system
				labels:
					k8s-app: kube-dns
	- name: dev-nginx
		selectors:
			- namespace: dev
				labels:
					profile: fargate
