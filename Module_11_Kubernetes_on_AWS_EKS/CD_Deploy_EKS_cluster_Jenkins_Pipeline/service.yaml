---
apiVersion: v1
kind: Service
metadata:
	name: application-name
	labels:
		app.kubernetes.io/name: application-name
		app.kubernetes.io/part-of: project-name
spec:
	type: ClusterIP
	selector:
		app.kubernetes.io/name: application-name
	ports:
		- name: http
			protocol: TCP
			port: service-port
			targetPort: http