apiVersion: v1
kind: Namespace
metadata:
	name: <application-namespace>
---
apiVersion: apps/v1
kind: Deployment
metadata:
	name: application-name
	labels:
		app.kubernetes.io/name: <application-name>
		app.kubernetes.io/part-of: <project-name>
spec:
	replicas: <replica-count>
	selector:
		matchLabels:
			app.kubernetes.io/name: <application-name>
	template:
		metadata:
			labels:
				app.kubernetes.io/name: <application-name>
				app.kubernetes.io/part-of: <project-name>
		spec:
			containers:
				- name: application-name
					image: registry/repository:initial-immutable-tag
					imagePullPolicy: IfNotPresent
					ports:
						- name: http
							containerPort: <container-port>
					readinessProbe:
						httpGet:
							path: <health-path>
							port: http
						initialDelaySeconds: <initial-delay-seconds>
						periodSeconds: <period-seconds>
					livenessProbe:
						httpGet:
							path: <health-path>
							port: http
						initialDelaySeconds: <initial-delay-seconds>
						periodSeconds: <period-seconds>
					resources:
						requests:
							cpu: <cpu-request>
							memory: <memory-request>
						limits:
							cpu: <cpu-limit>
							memory: <memory-limit>
					securityContext:
						allowPrivilegeEscalation: false
						readOnlyRootFilesystem: true
						runAsNonRoot: true
						capabilities:
							drop:
								- ALL
