---
- name: Deploy app in new namespace
  tasks:
    - name: Create a k8s namespace 
      kubernetes.core.k8s:
        name: myapp 
        api_version: v1
        kind: Namespace 
        state: present 
        kubeconfig: /Users/aleksanderkirsten/terraform/kubeconfig_myapp-eks-cluster
    - name: Deploy nginx app 
      kubernetes.core.k8s:
        src: ~/demo-projects/K8s-Files/nginx-config.yaml 
        state: present 
        kubeconfig: /Users/aleksanderkirsten/terraform/kubeconfig_myapp-eks-cluster 
        namespace: myapp 
  
