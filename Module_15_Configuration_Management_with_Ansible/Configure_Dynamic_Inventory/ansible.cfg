[defaults]
# PRODUCTION: Keep host-key verification enabled. Disabling it is acceptable only for an
# isolated disposable lab; production should distribute trusted host keys via a known_hosts
# file, SSH certificates, or use SSM-based connections.
host_key_checking = False 
# PRODUCTION: Point inventory at inventory_aws_ec2.yaml (or consistently pass it with -i) once
# the dynamic inventory is ready. Keep hosts only as a separate static-inventory lab example.
inventory = hosts 

# PRODUCTION: Install and pin amazon.aws in requirements.yml. Use an AWS profile/assume-role or
# workload identity with least privilege instead of long-lived AWS access keys on the controller.
enable_plugins = aws_ec2 
# PRODUCTION: Do not commit a user-specific private-key path. Inject it through CI/CD secrets,
# use SSH certificates, or prefer AWS SSM Session Manager for access without inbound SSH.
private_key_file = ~/.ssh/id_rsa 