# PRODUCTION: Define a non-production default inventory (or always pass -i in CI/CD), roles_path,
# retry_files_enabled = False, and a log path protected from secrets. Pin required collections in
# requirements.yml. Keep host_key_checking enabled and distribute trusted host keys/certificates
# instead of disabling verification for convenience.


[defaults]
inventory = inventory.example.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent