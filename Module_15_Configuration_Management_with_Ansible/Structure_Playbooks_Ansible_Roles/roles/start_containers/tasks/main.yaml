---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ application_directory }}"
    state: directory
    owner: "{{ deployment_user }}"
    group: "{{ deployment_user }}"
    mode: "0755"

- name: Copy Docker Compose definition
  ansible.builtin.copy:
    src: "{{ compose_filename }}"
    dest: "{{ application_directory }}/{{ compose_filename }}"
    owner: "{{ deployment_user }}"
    group: "{{ deployment_user }}"
    mode: "0644"

- name: Log in to private container registry
  community.docker.docker_login:
    registry_url: "{{ docker_registry_url }}"
    username: "{{ docker_registry_username }}"
    password: "{{ docker_registry_password }}"
  no_log: true
  when:
    - docker_registry_url | length > 0
    - docker_registry_username | length > 0
    - docker_registry_password | length > 0

- name: Start application containers
  community.docker.docker_compose_v2:
    project_src: "{{ application_directory }}"
    state: present
  become_user: "{{ deployment_user }}"