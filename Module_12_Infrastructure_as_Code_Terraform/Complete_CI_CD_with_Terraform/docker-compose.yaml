services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - ci_network
    restart: unless-stopped

  myapp:
    image: myapp:latest
    build:
      context: ./myapp
      dockerfile: Dockerfile
    container_name: myapp
    ports:
      - "8081:80"
    networks:
      - ci_network
    restart: unless-stopped

networks:
  ci_network:
    driver: bridge

volumes:
  jenkins_home: